<h1>Registro de Estudiantes</h1>

<div class="formulario">
  <div style="display:flex;gap:40px;margin-bottom:20px;flex-wrap:wrap">
    <div><div id="eTot" style="font-size:1.8rem;font-weight:700;color:#1e3a8a">0</div><div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px">Total</div></div>
    <div><div id="eAp" style="font-size:1.8rem;font-weight:700;color:#16a34a">0</div><div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px">Aprobados</div></div>
    <div><div id="eRep" style="font-size:1.8rem;font-weight:700;color:#dc2626">0</div><div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px">Reprobados</div></div>
  </div>

  <h2>Registrar estudiante</h2>
  <div class="fila">
    <div class="campo" style="flex:2">
      <label>Nombre completo</label>
      <input id="eNombre" placeholder="Ej: Carlos Pérez">
    </div>
    <div class="campo" style="flex:2">
      <label>Asignatura</label>
      <input id="eAsignatura" placeholder="Ej: Programación Orientada a Objetos">
    </div>
    <div class="campo">
      <label>Nota (0.0 – 5.0)</label>
      <input id="eNota" type="number" placeholder="0.0" min="0" max="5" step="0.1">
    </div>
  </div>
  <div class="botones">
    <button onclick="registrarEstudiante()">Registrar</button>
  </div>
  <p id="msgEst" style="margin-top:10px;font-size:14px"></p>
</div>

<div class="formulario">
  <h2>Lista de estudiantes</h2>
  <ul id="listaEstudiantes" style="list-style:none;text-align:left">
    <li style="color:#ccc;font-size:14px">Sin estudiantes aún</li>
  </ul>
</div>

<script src="../js/estudiantes.js"></script>
