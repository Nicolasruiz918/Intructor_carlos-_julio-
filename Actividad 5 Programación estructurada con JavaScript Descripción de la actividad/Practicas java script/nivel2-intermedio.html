<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivel 2 - Intermedio</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav>
        <ul>
            <li><a href="index.html">Nivel 1</a></li>
            <li><a href="nivel2-intermedio.html">Nivel 2</a></li>
            <li><a href="nivel3-avanzado.html">Nivel 3</a></li>
        </ul>
    </nav>

    <h1>Nivel 2 – Intermedio</h1>

    <!-- Ejercicio 4 -->
    <section>
        <h2>4. Contador de clics</h2>
        <button id="btnContar">¡Clic aquí!</button>
        <p id="contador">Clics: 0</p>
    </section>

    <!-- Ejercicio 5 -->
    <section>
        <h2>5. Lista dinámica (agregar tareas)</h2>
        <input type="text" id="tareaInput" placeholder="Escribe una tarea">
        <button id="btnAgregar">Agregar</button>
        <ul id="listaTareas"></ul>
    </section>

    <!-- Ejercicio 6 -->
    <section>
        <h2>6. Validación de formulario</h2>
        <form id="formulario">
            <input type="text" id="nombre" placeholder="Nombre"><br>
            <input type="email" id="correo" placeholder="Correo"><br>
            <input type="number" id="edad" placeholder="Edad"><br>
            <button type="submit">Enviar</button>
        </form>
        <p id="mensajeForm"></p>
    </section>

    <footer>
        <a href="index.html" class="back">← Volver al nivel anterior </a>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
