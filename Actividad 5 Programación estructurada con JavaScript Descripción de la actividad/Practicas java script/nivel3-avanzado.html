<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivel 3 - Avanzado</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav>
        <ul>
            <li><a href="index.html">Nivel 1</a></li>
            <li><a href="nivel2-intermedio.html">Nivel 2</a></li>
            <li><a href="nivel3-avanzado.html">Nivel 3</a></li>
        </ul>
    </nav>

    <h1>Nivel 3 – Intermedio-avanzado</h1>

    <!-- Ejercicio 7 -->
    <section>
        <h2>7. Calculadora básica (+ - * /)</h2>
        <input type="number" id="calcA" placeholder="Número 1">
        <select id="operacion">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">÷</option>
        </select>
        <input type="number" id="calcB" placeholder="Número 2">
        <button id="btnCalcular">=</button>
        <p id="resultadoCalc">Resultado: </p>
    </section>

    <!-- Ejercicio 8 -->
    <section>
        <h2>8. Lista con eliminar</h2>
        <input type="text" id="tareaInput2" placeholder="Nueva tarea">
        <button id="btnAgregar2">Agregar</button>
        <ul id="listaTareas2"></ul>
    </section>

    <!-- Ejercicio 9 -->
    <section>
        <h2>9. Temporizador</h2>
        <h3 id="resultado-temporizador">00:00</h3>
        <button id="btnIniciar">Iniciar</button>
        <button id="btnDetener">Detener</button>
        <button id="btnReiniciar">Reiniciar</button>
    </section>

    <footer>
        <a href="index.html" class="back">← Volver al nivel anterior </a>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
